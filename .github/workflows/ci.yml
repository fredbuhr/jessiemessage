name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Build offline workbench
        run: npm run build
      - name: Downloadable preview (open HTML, no console)
        uses: actions/upload-artifact@v4
        with:
          name: JessieMessage-apercu-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: artifacts/
          include-hidden-files: false
