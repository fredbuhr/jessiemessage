name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run tests
        run: npm test
      - name: Validate build
        run: npm run build
      - name: Downloadable workbench and reviewed source
        uses: actions/upload-artifact@v4
        with:
          name: JessieMessage-workbench-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: error
          path: |
            design/
            docs/
            server/
            public/
            tests/
            scripts/
            database/
            package.json
            README.md
          include-hidden-files: false
