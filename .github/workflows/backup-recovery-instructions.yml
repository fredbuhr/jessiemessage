name: Windows backup recovery instructions

on:
  push:
    branches: ["feat/**", "fix/**", main]
    paths:
      - scripts/JessieMessage-recuperation-052.ps1
      - scripts/JessieMessage-sauvegardes-055.ps1
      - server/backup/copy-kit.mjs
      - tests/windows/backup-copy.ps1
      - .github/workflows/backup-recovery-instructions.yml
  pull_request:
    branches: ["feat/**", "fix/**", main]
    paths:
      - scripts/JessieMessage-recuperation-052.ps1
      - scripts/JessieMessage-sauvegardes-055.ps1
      - server/backup/copy-kit.mjs
      - tests/windows/backup-copy.ps1
      - .github/workflows/backup-recovery-instructions.yml

permissions:
  contents: read

concurrency:
  group: recovery-instructions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  syntax:
    name: Windows PowerShell 5.1 instructions
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Parse owner instructions without creating any key
        shell: powershell
        run: |
          $jmTokens = $null
          $jmErrors = $null
          $jmScript = (Resolve-Path 'scripts/JessieMessage-recuperation-052.ps1').Path
          $null = [System.Management.Automation.Language.Parser]::ParseFile($jmScript, [ref]$jmTokens, [ref]$jmErrors)
          if ($jmErrors.Count -ne 0) { throw ($jmErrors | Out-String) }
          Write-Output 'Windows PowerShell 5.1 syntax verified; no key generated.'
      - name: Verify harmless native warnings and failed native commands
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $jmTokens = $null
          $jmErrors = $null
          $jmAst = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/JessieMessage-recuperation-052.ps1').Path, [ref]$jmTokens, [ref]$jmErrors)
          $jmFunction = $jmAst.Find({ param($node) $node -is [System.Management.Automation.Language.FunctionDefinitionAst] -and $node.Name -eq 'Get-JmGpgOutput' }, $true)
          Invoke-Expression $jmFunction.Extent.Text
          $script:jmGpg = (Get-Process -Id $PID).Path
          $jmGoodCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('[Console]::Error.WriteLine("harmless warning"); [Console]::Out.WriteLine("public fixture"); exit 0'))
          $jmBadCommand = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes('[Console]::Error.WriteLine("synthetic failure"); exit 1'))
          $jmResult = @(Get-JmGpgOutput -GpgArguments @('-NoProfile', '-EncodedCommand', $jmGoodCommand))
          if ($jmResult.Count -ne 1 -or $jmResult[0] -ne 'public fixture') { throw 'Native warning handling failed.' }
          $jmRejected = $false
          try { $null = Get-JmGpgOutput -GpgArguments @('-NoProfile', '-EncodedCommand', $jmBadCommand) } catch { $jmRejected = $true }
          if (-not $jmRejected -or $ErrorActionPreference -ne 'Stop') { throw 'Native failure handling failed.' }
          Write-Output 'Native warnings and failures verified without generating a key.'
          exit 0
      - name: Parse and exercise Windows backup collector with synthetic local files
        shell: powershell
        run: |
          $jmTokens = $null
          $jmErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'scripts/JessieMessage-sauvegardes-055.ps1').Path, [ref]$jmTokens, [ref]$jmErrors)
          if ($jmErrors.Count -ne 0) { throw ($jmErrors | Out-String) }
          & ./tests/windows/backup-copy.ps1
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw 'Windows collector verification failed.' }
      - name: Create the actual Windows ZIP with a synthetic expired pairing code
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { createCopyKit } from './server/backup/copy-kit.mjs';
          import { writeFile } from 'node:fs/promises';
          await writeFile('synthetic-kit.zip', await createCopyKit({version:1,destinationId:'1'.repeat(32),pairingCode:'A'.repeat(43),expiresAt:1,origin:'https://jessiemessage.com'}));
          JS
      - name: Expand ZIP using native Windows tools without running the installer
        shell: powershell
        run: |
          Expand-Archive -LiteralPath synthetic-kit.zip -DestinationPath synthetic-kit
          if (@(Get-ChildItem synthetic-kit -File).Count -ne 4) { throw 'Incomplete Windows kit.' }
          foreach ($jmFile in @('Installer.cmd', 'JessieMessage-sauvegardes-055.ps1', 'raccordement.json', 'LIRE-MOI.txt')) {
            if (-not (Test-Path -LiteralPath (Join-Path synthetic-kit $jmFile))) { throw 'Missing Windows kit file.' }
          }
          Write-Output 'Actual ZIP expanded by Windows; expired synthetic code only, installer not run.'
