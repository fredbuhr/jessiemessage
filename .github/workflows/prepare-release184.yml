# Proposed qualification only; no hosting, tag, release or metadata mutation.
name: Qualify 1.8.4 staging operator

on:
  push:
    branches: ["ops/prepare-v1.8.4"]
    paths:
      - ".github/workflows/prepare-release184.yml"
      - "ops/prepare-release184.py"
      - "ops/test-prepare-release184.py"

permissions: {}

concurrency:
  group: prepare-release184
  cancel-in-progress: false

jobs:
  operator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact operator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use qualified Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Test staging with disposable local Git fixtures
        run: python3 ops/test-prepare-release184.py
