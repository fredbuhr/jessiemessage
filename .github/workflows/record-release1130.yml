# Qualify only synthetic writer behavior; no hosting or release mutation.
# Finalized pins still require actual startup and public HTTP identity before recording.
name: Qualify 1.13.0 metadata operator

on:
  push:
    branches: ["ops/record-v1.13.0"]
    paths:
      - ".github/workflows/record-release1130.yml"
      - "ops/record-release1130.py"
      - "ops/test-record-release1130.py"

permissions: {}

concurrency:
  group: record-release1130
  cancel-in-progress: false

jobs:
  operator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact operator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Use qualified Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Record exact native Node version
        run: node --version
      - name: Test metadata recording with isolated synthetic files
        run: PYTHONDONTWRITEBYTECODE=1 python3 ops/test-record-release1130.py
