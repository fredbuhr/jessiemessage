# Adapted from the qualified 1.8.1 publisher on ops/publish-v1.8.1.
# The exact merged main source/tree and its five-job CI are pinned below.
name: Publish qualified JessieMessage release

on:
  push:
    branches: ["ops/publish-v1.8.2"]
    paths: [".github/workflows/publish-qualified.yml"]

permissions: {}

concurrency:
  group: publish-jessiemessage-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  operator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact operator commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Use qualified Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Test publication with simulated GitHub API
        run: python3 ops/test-publish-qualified.py
      - name: Test isolated patch release preparation
        run: python3 ops/test-prepare-release182.py
  publish:
    needs: operator-tests
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - name: Use qualified Node.js 24.22.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Verify and publish the immutable qualified 1.8.2 correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, json, os, re, subprocess, urllib.error, urllib.request

          repo = "fredbuhr/jessiemessage"
          version = "1.8.2"
          target = "78e6b8b2f6b19020c060345b9313a81829e9c8da"
          tree = "7b722ca1fbd3416acecffa3c122e967511184d4c"
          ci_text = "39832723570"
          baseline = "1ae4c75152795ea6f31c2ff364e337a1d5a04e31"
          rollback_target = "6b3319a77c307ed7d6b003fe33de36807c70c266"
          rollback_id = 420600213
          latest_tag = "v1.8.1"
          latest_id = 420741528
          assert re.fullmatch(r"[0-9a-f]{40}", target)
          assert re.fullmatch(r"[0-9a-f]{40}", tree)
          assert re.fullmatch(r"[1-9][0-9]*", ci_text)
          assert version == "1.8.2"
          ci, tag = int(ci_text), "v" + version
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/ops/publish-" + tag
          assert os.environ["GITHUB_EVENT_NAME"] == "push"
          assert subprocess.check_output(["node", "--version"], text=True, timeout=5).strip() == "v24.22.1"
          publication_qualified = False

          def api(path, data=None, optional=False):
              if data is not None:
                  assert publication_qualified, "Publication requires every qualification gate first"
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"},
                  method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if optional and error.code == 404:
                      return None
                  raise SystemExit("GitHub operation refused: HTTP " + str(error.code))

          def source_file(path):
              value = api("contents/" + path + "?ref=" + target)
              assert value["type"] == "file" and value["encoding"] == "base64"
              return base64.b64decode(value["content"], validate=False).decode("utf-8")

          run = api("actions/runs/" + str(ci))
          assert run["head_sha"] == target and run["head_branch"] == "main"
          assert run["event"] == "push" and run["path"] == ".github/workflows/ci.yml"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          assert run["run_attempt"] == 1, "Use the clean main qualification, not a rerun"
          jobs = api("actions/runs/" + str(ci) + "/jobs?per_page=100")
          expected = {"verify", "MariaDB 10.11", "MariaDB 11.4",
                      "Chrome keyboard and chat lifecycle",
                      "Chrome HTTPS authentication and messaging with MariaDB"}
          assert jobs["total_count"] == 5 and len(jobs["jobs"]) == 5
          assert {job["name"] for job in jobs["jobs"]} == expected
          assert all(job["status"] == "completed" and job["conclusion"] == "success"
                     and job["head_sha"] == target and job["run_id"] == ci and job["run_attempt"] == 1
                     for job in jobs["jobs"])
          assert api("git/commits/" + target)["tree"]["sha"] == tree
          # Main may already contain the product release; never move this pin.
          comparison = api("compare/" + target + "...main")
          assert comparison["merge_base_commit"]["sha"] == target and comparison["status"] in {"identical", "ahead"}
          package = json.loads(source_file("package.json"))
          lock = json.loads(source_file("package-lock.json"))
          assert package["name"] == lock["name"] == lock["packages"][""]["name"] == "jessiemessage"
          assert package["version"] == lock["version"] == lock["packages"][""]["version"] == version
          assert package["engines"]["node"] == lock["packages"][""]["engines"]["node"] == ">=24 <25"
          workflow = source_file(".github/workflows/ci.yml")
          # Exact official Node24 action pins from the lot3 source verification.
          action_uses = re.findall(r"(?m)^\s+uses: ([^\s#]+)(?:[ \t]+#[^\n]*)?[ \t]*$", workflow)
          expected_uses = {
              "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1": 4,
              "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1": 4,
              "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9": 2,
          }
          assert len(action_uses) == 10
          assert {name: action_uses.count(name) for name in set(action_uses)} == expected_uses
          assert len(re.findall(r'(?m)^\s+node-version: "24\.22\.1"[ \t]*$', workflow)) == 4
          assert len(re.findall(r"(?m)^\s+persist-credentials: false[ \t]*$", workflow)) == 4
          assert len(re.findall(r"(?m)^\s+package-manager-cache: false[ \t]*$", workflow)) == 4
          gates = source_file("server/release-features.mjs")
          statements = [line.strip() for line in gates.splitlines() if line.strip() and not line.lstrip().startswith("//")]
          assert statements == ["export const VIDEO_CREATION_ENABLED = true;", "export const QUICK_REPLIES_WRITABLE = true;"]
          runtime = source_file("server/index.mjs")
          assert 'import { VIDEO_CREATION_ENABLED, QUICK_REPLIES_WRITABLE } from "./release-features.mjs";' in runtime
          assert runtime.count("creationEnabled: VIDEO_CREATION_ENABLED") == 3
          assert runtime.count("videoCreationEnabled: VIDEO_CREATION_ENABLED") == 6
          assert runtime.count("writable: QUICK_REPLIES_WRITABLE") == 3

          old_tree = api("git/trees/" + baseline + "?recursive=1")
          new_tree = api("git/trees/" + tree + "?recursive=1")
          assert old_tree["truncated"] is False and new_tree["truncated"] is False
          def blobs(value, prefix):
              return {item["path"]: (item["sha"], item["mode"]) for item in value["tree"]
                      if item["type"] == "blob" and item["path"].startswith(prefix)}
          normal = blobs(new_tree, "db/migrations/")
          assert len(normal) == 33 and normal == blobs(old_tree, "db/migrations/")
          assert sorted(int(re.fullmatch(r"db/migrations/([0-9]{4})_[a-z0-9_]+\.sql", path).group(1)) for path in normal) == list(range(1, 34))
          candidates = blobs(new_tree, "server/video/migrations/")
          assert set(candidates) == {"server/video/migrations/0034_video_storage_state.sql",
                                     "server/video/migrations/0035_video_assets.sql",
                                     "server/video/migrations/0036_message_video.sql"}
          assert all(mode == "100644" for sha, mode in candidates.values())
          assert candidates == blobs(old_tree, "server/video/migrations/"), "No schema change in this patch release"
          assert {item["path"] for item in new_tree["tree"] if item["type"] == "blob" and item["path"].endswith(".sql")} == set(normal) | set(candidates)

          name = "JessieMessage 1.8.2 — Fiabilité de la messagerie"
          details = ["Correctif publié et qualifié ; activation hébergée à effectuer séparément.",
                     "- Les refus de quota personnel ne consomment plus le budget commun ; admission et cycle de vie des photos/vidéos, exports vidéo et horloge CRM sont corrigés.",
                     "- Reprise du brouillon texte dans le même onglet après rechargement, sans envoi automatique ; conservation du travail des diffusions en arrière-plan et protection des options d’annonce.",
                     "- Aide FR/EN harmonisée, guides et historique séparés, reliquats sans usage retirés ; actions CI officielles épinglées et diagnostic SQL synthétique qualifié.",
                     "- Node.js 24.22.1 et SQL36 inchangés : aucune migration ni nouvelle clé/configuration privée. Le repli technique [v1.7.2](https://github.com/fredbuhr/jessiemessage/releases/tag/v1.7.2) est conservé, source `" + rollback_target + "`.",
                     "- Le test hébergé de sauvegarde reste reporté à la demande de l’utilisateur ; faits juridiques et observation réseau non établis restent explicites, sans garantie de capacité du mutualisé."]
          body = "\n".join(details + ["", "Commit : `" + target + "`.",
              "Validation : [CI complète, 5/5 jobs](https://github.com/" + repo + "/actions/runs/" + str(ci) + ").",
              "", "La production reste 1.8.1 / SQL36 jusqu’à activation. L’état déployé est consigné dans [REPRISE](https://github.com/" + repo + "/blob/main/docs/REPRISE.md)."])
          def verify_release(value):
              assert value["tag_name"] == tag and value["target_commitish"] == target
              assert value["draft"] is False and value["prerelease"] is False
              assert value["name"] == name and value["body"] == body, "Existing release metadata must never be edited"
          def verify_previous_latest():
              value = api("releases/latest")
              assert value["id"] == latest_id and value["tag_name"] == latest_tag, "Unexpected latest before creating this release"
              assert value["target_commitish"] == baseline
          def verify_published_latest(release):
              value = api("releases/latest")
              assert value["id"] == release["id"], "Latest must identify this exact release"
              verify_release(value)

          rollback_reference = api("git/ref/tags/v1.7.2")
          assert rollback_reference["object"]["type"] == "commit" and rollback_reference["object"]["sha"] == rollback_target
          rollback_release = api("releases/tags/v1.7.2")
          assert rollback_release["id"] == rollback_id and rollback_release["tag_name"] == "v1.7.2"
          assert rollback_release["target_commitish"] == rollback_target
          assert rollback_release["draft"] is False and rollback_release["prerelease"] is False

          # Check every existing object before the first write. No PATCH,
          # DELETE or tag movement exists; identical interrupted retries only.
          reference = api("git/ref/tags/" + tag, optional=True)
          if reference is not None:
              assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target, "Existing tag must never be moved"
          existing = api("releases/tags/" + tag, optional=True)
          if existing is not None:
              assert reference is not None, "A release without its expected tag is inconsistent"
              verify_release(existing)
              verify_published_latest(existing)
          else:
              verify_previous_latest()
          publication_qualified = True
          if existing is None:
              if reference is None:
                  api("git/refs", {"ref": "refs/tags/" + tag, "sha": target})
              reference = api("git/ref/tags/" + tag)
              assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target
              # Recheck immediately before the release write. GitHub's create
              # endpoint advances latest in that same operation; no existing
              # release is edited and no separate alignment is scheduled.
              verify_previous_latest()
              api("releases", {"tag_name": tag, "target_commitish": target,
                  "name": name, "body": body, "draft": False, "prerelease": False, "make_latest": "true"})
          reference = api("git/ref/tags/" + tag)
          assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target
          release = api("releases/tags/" + tag)
          verify_release(release)
          verify_published_latest(release)
          print(json.dumps({"status": "published_verified", "tag": tag, "commit": target,
                            "tree": tree, "releaseUrl": release["html_url"], "ciRun": ci,
                            "nodeVersion": "24.22.1", "normalMigrations": 33, "videoCandidateMigrations": 3,
                            "videoCreationEnabled": True, "quickRepliesWritable": True, "schemaMigrations": 36, "migrationsChanged": False,
                            "rollback": {"tag": "v1.7.2", "commit": rollback_target, "releaseId": rollback_id},
                            "previousLatest": {"tag": latest_tag, "id": latest_id},
                            "latest": {"tag": tag, "id": release["id"], "source": target},
                            "publicationMode": "created_and_latest" if existing is None else "verified_existing_read_only",
                            "deploymentPerformed": False}))
