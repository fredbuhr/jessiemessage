name: Qualify JessieMessage 1.10.0 deployment helpers

on:
  push:
    branches: ["ops/qualify-v1.10.0"]
    paths: ["ops/*1100.py", ".github/workflows/qualify-operators1100.yml"]

permissions:
  contents: read

jobs:
  operators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
          package-manager-cache: false
      - name: Synthetic isolated preparation
        run: python3 ops/test-prepare-release1100.py
      - name: Synthetic checkpoint finalization
        run: python3 ops/test-record-release1100.py
      - name: Simulated publication API
        run: python3 ops/test-publish-qualified1100.py
