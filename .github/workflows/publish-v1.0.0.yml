name: Publish JessieMessage 1.0.0

on:
  push:
    branches: ["release/publish-v1.0.0"]
    paths: [".github/workflows/publish-v1.0.0.yml"]

permissions: {}

concurrency:
  group: publish-jessiemessage-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - name: Verify validated source and publish the pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, json, os, urllib.error, urllib.request

          repo = "fredbuhr/jessiemessage"
          target = "70b48aa845b70ca960724c8d37a6e94b3d5f47a8"
          tree = "485cade0aeeee41cb4c34f913cd98f6078c4636b"
          tag = "v1.0.0"
          ci = 39471679954
          assert os.environ["GITHUB_REPOSITORY"] == repo
          assert os.environ["GITHUB_REF"] == "refs/heads/release/publish-v1.0.0"

          def api(path, data=None, optional=False):
              request = urllib.request.Request(
                  "https://api.github.com/repos/" + repo + "/" + path,
                  data=None if data is None else json.dumps(data).encode(),
                  headers={"Authorization": "Bearer " + os.environ["GH_TOKEN"],
                           "Accept": "application/vnd.github+json",
                           "Content-Type": "application/json",
                           "X-GitHub-Api-Version": "2022-11-28"},
                  method="GET" if data is None else "POST")
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if optional and error.code == 404:
                      return None
                  raise SystemExit("GitHub operation refused: HTTP " + str(error.code))

          run = api("actions/runs/" + str(ci))
          assert run["head_sha"] == target and run["head_branch"] == "main"
          assert run["event"] == "push" and run["path"] == ".github/workflows/ci.yml"
          assert run["status"] == "completed" and run["conclusion"] == "success"
          jobs = api("actions/runs/" + str(ci) + "/jobs?per_page=100")
          expected = {"verify", "MariaDB 10.11", "MariaDB 11.4",
                      "Chrome keyboard and chat lifecycle",
                      "Chrome HTTPS authentication and messaging with MariaDB"}
          assert jobs["total_count"] == 5 and len(jobs["jobs"]) == 5
          assert {job["name"] for job in jobs["jobs"]} == expected
          assert all(job["status"] == "completed" and job["conclusion"] == "success" for job in jobs["jobs"])
          assert api("git/commits/" + target)["tree"]["sha"] == tree
          package = api("contents/package.json?ref=" + target)
          assert json.loads(base64.b64decode(package["content"]))["version"] == "1.0.0"

          reference = api("git/ref/tags/" + tag, optional=True)
          if reference is not None:
              assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target, "Existing tag must never be moved"
          existing = api("releases/tags/" + tag, optional=True)
          if existing is not None:
              assert reference is not None and existing["tag_name"] == tag
              assert existing["draft"] is False and existing["prerelease"] is False
              release = existing
          else:
              if reference is None:
                  api("git/refs", {"ref": "refs/tags/" + tag, "sha": target})
              reference = api("git/ref/tags/" + tag)
              assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target
              body = "\n".join([
                  "Cette livraison établit la référence 1.0.0 de la V1 déjà livrée sous le numéro technique 0.86.0.",
                  "", "- Versions des métadonnées harmonisées et rôles de la documentation clarifiés.",
                  "- Identité de démarrage affichée dans les détails techniques privés de l'administration : version, commit observé, Node et date.",
                  "- Aucun changement métier de messagerie, de dépendances ou de schéma SQL.",
                  "- L'évolution des accusés de lecture reste séparée pour 1.1.0.",
                  "", "Commit : `" + target + "`.",
                  "Validation : [CI complète, 5/5 jobs](https://github.com/" + repo + "/actions/runs/" + str(ci) + ").",
                  "", "L'état réellement déployé et le repli sont consignés dans [REPRISE](https://github.com/" + repo + "/blob/main/docs/REPRISE.md)."
              ])
              release = api("releases", {"tag_name": tag, "target_commitish": target,
                            "name": "JessieMessage 1.0.0 — Référence V1", "body": body,
                            "draft": False, "prerelease": False, "make_latest": "true"})
          reference = api("git/ref/tags/" + tag)
          assert reference["object"]["type"] == "commit" and reference["object"]["sha"] == target
          print(json.dumps({"status": "published_verified", "tag": tag, "commit": target,
                            "tree": tree, "releaseUrl": release["html_url"], "ciRun": ci}))
