<script id="demo-model">
"use strict";
// In-memory demo only. No networking, storage, real invitations, or authentication.
globalThis.JessieDemo = (() => {
  function initialState() {
    return {
      clients: [
        {id:"alex",name:"Alex",tags:["VIP","FR"],active:true,marketing:true,unread:2,note:"",reminder:"",sent:["m1"]},
        {id:"liam",name:"Liam",tags:["EN"],active:true,marketing:true,unread:1,note:"",reminder:"",sent:[]},
        {id:"hugo",name:"Hugo",tags:["FR","Suivi"],active:true,marketing:false,unread:0,note:"",reminder:"",sent:["m2"]},
        {id:"max",name:"Max",tags:["VIP","EN"],active:false,marketing:true,unread:0,note:"",reminder:"",sent:[]}
      ],
      media:[{id:"m1",title:"Lumière naturelle",tone:1},{id:"m2",title:"Un instant",tone:2},{id:"m3",title:"Notes du soir",tone:3}],
      messages:{alex:[{from:"jessie",text:"Bienvenue dans notre espace, Alex 👋",media:["m1"],time:"14:20"},{from:"client",text:"Merci Jessie, ravi de te retrouver ici.",media:[],time:"14:22"}],liam:[{from:"client",text:"Hi Jessie, good to see you here!",media:[],time:"14:10"}],hugo:[{from:"jessie",text:"Un instant à partager.",media:["m2"],time:"13:50"}],max:[]},
      campaigns:[],ageDeclared:false
    };
  }
  function plan(state,{group="all",mediaIds=[],skipDuplicates=true,purpose="service",text=""}={}) {
    if(!["service","marketing"].includes(purpose)) throw new Error("Invalid purpose");
    const ids=[...new Set(mediaIds)];
    if(ids.some(id=>!state.media.some(m=>m.id===id))) throw new Error("Unknown media");
    if(!text.trim() && !ids.length) return [];
    return state.clients.filter(c=>c.active&&(group==="all"||c.tags.includes(group))&&(purpose!=="marketing"||c.marketing)).map(c=>{
      const fresh=skipDuplicates?ids.filter(id=>!c.sent.includes(id)):ids;
      return {clientId:c.id,mediaIds:fresh,duplicates:ids.length-fresh.length,skip:ids.length>0&&fresh.length===0};
    });
  }
  function dispatch(state,options,key) {
    if(!key||typeof key!=="string") throw new Error("Campaign key required");
    const recipients=plan(state,options).filter(r=>!r.skip);
    if(state.campaigns.some(c=>c.key===key)) return 0;
    for(const r of recipients) {
      state.messages[r.clientId].push({from:"jessie",text:(options.text||"").trim(),media:[...r.mediaIds],time:"Démo",campaign:key});
      const c=state.clients.find(x=>x.id===r.clientId);
      c.sent=[...new Set([...c.sent,...r.mediaIds])];
    }
    state.campaigns.push({key,recipients:recipients.map(r=>r.clientId)});
    return recipients.length;
  }
  return Object.freeze({initialState,plan,dispatch});
})();
</script>
<script id="demo-ui">
"use strict";

const state=JessieDemo.initialState();
let lang=navigator.language.toLowerCase().startsWith("fr")?"fr":"en";
const t=(fr,en)=>lang==="fr"?fr:en;
const ui={view:"home",section:"messages",client:"alex",filter:"all",search:"",mobileChat:false,emoji:false,selected:["m2"],group:"all",purpose:"service",skip:true,bulkText:"",bulkDone:false,campaign:0,drafts:{client:"",admin:""},attachments:{client:[],admin:[]}};
let portrait="",mark="";
try{const b=JSON.parse($("#local-branding").textContent);if(/^data:image\/(jpeg|png|webp);base64,/.test(b.portrait||""))portrait=b.portrait;if(/^data:image\/(jpeg|png|webp);base64,/.test(b.mark||""))mark=b.mark;}catch{}
let toastTimer;

function avatar(name,isJessie=false){return `<span class="avatar">${isJessie&&portrait?`<img src="${esc(portrait)}" alt="">`:esc(name.slice(0,2))}</span>`;}
function art(m){return `<div class="art tone-${m.tone}">${portrait&&m.id==="m1"?`<img src="${esc(portrait)}" alt="${t("Photo de référence fournie","Provided reference photo")}">`:esc(m.id.replace("m","0"))}</div>`;}
function drawHome(){return `<section class="landing"><div class="hero-copy"><span class="eyebrow">${t("PARLONS, SIMPLEMENT.","LET’S KEEP IT PERSONAL.")}</span><h1>${t("Un message.<br><em>Un peu plus près.</em>","A message.<br><em>A little closer.</em>")}</h1><p class="lead">${t("Un espace pour échanger avec Jessie, partager un instant et garder le contact. Tout simplement.","A place to talk with Jessie, share a moment and stay connected. Simply.")}</p><div class="invite-box"><label class="check"><input type="checkbox" id="age-declaration" ${state.ageDeclared?"checked":""}>${t("Je déclare avoir au moins 18 ans.","I declare that I am at least 18 years old.")}</label><button class="btn primary" id="enter-demo" ${state.ageDeclared?"":"disabled"}>${t("Découvrir la conversation","Explore the conversation")} <span aria-hidden="true">↗</span></button><span class="small muted">${t("Démonstration uniquement. Cette case n’est pas une vérification d’âge. Aucun compte n’est créé.","Demo only. This checkbox does not verify age. No account is created.")}</span></div></div><div class="hero-portrait">${portrait?`<img src="${esc(portrait)}" alt="${t("Portrait de référence pour JessieMessage","Reference portrait for JessieMessage")}">`:'<span class="portrait-fallback">J.</span>'}<div class="photo-note"><strong>${t("Un espace à vous.","A space for you.")}</strong><p>${t("À terme : votre invitation ouvre votre conversation.","Planned experience: your invitation opens your conversation.")}</p></div></div></section>`;}
function renderMessages(id,clientView){const msgs=state.messages[id];return `<div class="date">${t("AUJOURD’HUI · EXEMPLE FICTIF","TODAY · FICTIONAL EXAMPLE")}</div>`+(msgs.length?msgs.map(m=>{const own=clientView?m.from==="client":m.from==="jessie";return `<div class="message ${own?"own":""}"><div class="bubble">${esc(m.text)}${m.media.map(mid=>{const asset=state.media.find(a=>a.id===mid);return asset?`<div class="media-thumb">${art(asset)}</div>`:"";}).join("")}</div><div class="time">${esc(m.time)}</div></div>`;}).join(""):`<div class="empty">${t("Votre prochain message commence ici.","Your next conversation starts here.")}</div>`);}
function chat(clientView){const c=state.clients.find(x=>x.id===ui.client);const draft=(clientView?"client":"admin")+":"+c.id;ui.drafts[draft]??="";ui.attachments[draft]??=[];return `<section class="chat ${clientView?"panel":""}"><div class="chat-head">${!clientView?`<button class="icon-btn mobile-back" data-action="back" aria-label="${t("Retour aux conversations","Back to conversations")}">‹</button>`:""}${avatar(clientView?"Jessie":c.name,clientView)}<div class="person"><strong>${clientView?"Jessie":esc(c.name)}</strong><small>${t("Conversation de démonstration","Demo conversation")}</small></div><button class="icon-btn" data-action="gallery" aria-label="${t("Médias partagés","Shared media")}">▧</button>${clientView?`<button class="icon-btn" data-action="preferences" aria-label="${t("Préférences","Preferences")}">⚙</button>`:`<button class="btn small-btn" data-action="profile">${t("Fiche client","Client details")}</button>`}</div><div class="messages" id="messages">${renderMessages(c.id,clientView)}</div><div class="composer">${ui.emoji?`<div class="emoji-tray">${["👋","😊","✨","🤍","😘","🙏"].map(e=>`<button data-emoji="${e}" aria-label="${e}">${e}</button>`).join("")}</div>`:""}<div class="draft-media">${ui.attachments[draft].map(id=>`<button data-unattach="${id}">${esc(state.media.find(m=>m.id===id)?.title)} ×</button>`).join("")}</div><form id="message-form" class="composer-row"><button type="button" class="icon-btn" data-action="attach" aria-label="${t("Choisir un média de démonstration","Choose demo media")}">＋</button><button type="button" class="icon-btn" data-action="emoji" aria-label="${t("Émojis","Emoji")}">☺</button><textarea id="message-input" maxlength="4000" aria-label="${t("Message de démonstration","Demo message")}" placeholder="${t("Votre message…","Your message…")}">${esc(ui.drafts[draft])}</textarea><button type="submit" class="btn primary" aria-label="${t("Ajouter à la conversation de démonstration","Add to demo conversation")}">↑</button></form><small>${t("Aperçu local. Aucun message n’est envoyé ni sauvegardé.","Local preview. No message is sent or saved.")}</small></div></section>`;}
function contacts(){const list=state.clients.filter(c=>c.active&&(ui.filter==="all"||c.tags.includes(ui.filter))&&c.name.toLowerCase().includes(ui.search.toLowerCase()));return `<aside class="contacts"><input id="search" class="search" value="${esc(ui.search)}" placeholder="${t("Rechercher une conversation","Search conversations")}" aria-label="${t("Rechercher un client fictif","Find a fictional client")}"><div class="chips">${["all","VIP","Suivi"].map(g=>`<button class="chip ${ui.filter===g?"active":""}" data-filter="${g}">${g==="all"?t("Tous","All"):g==="Suivi"?t("À suivre","Follow up"):g}</button>`).join("")}</div><div id="contact-list">${list.map(c=>`<button class="contact ${c.id===ui.client?"active":""}" data-client="${c.id}">${avatar(c.name)}<span class="contact-text"><strong>${esc(c.name)}</strong><p>${c.tags.map(esc).join(" · ")}</p></span>${c.unread?`<span class="unread">${c.unread}</span>`:""}</button>`).join("")||`<div class="empty">${t("Aucun résultat","No results")}</div>`}</div></aside>`;}
function mediaView(){return `<div class="grid-media">${state.media.map(m=>{const count=state.clients.filter(c=>c.sent.includes(m.id)).length;return `<article class="media-card panel ${ui.selected.includes(m.id)?"selected":""}">${art(m)}<h3>${esc(m.title)}</h3><p>${count} ${t("destinataire(s) · exemple","recipient(s) · example")}</p><button class="btn soft select-media" data-select-media="${m.id}" aria-pressed="${ui.selected.includes(m.id)}">${ui.selected.includes(m.id)?t("✓ Sélectionné","✓ Selected"):t("Sélectionner","Select")}</button></article>`;}).join("")}</div><p class="editor-status">${t("Références fictives. L’historique réel sera associé à chaque média et destinataire.","Fictional references. Real history will be tracked for each media asset and recipient.")}</p>`;}
function options(){return {group:ui.group,purpose:ui.purpose,mediaIds:[...ui.selected],skipDuplicates:ui.skip,text:ui.bulkText};}
function summary(){const p=JessieDemo.plan(state,options());const ready=p.filter(r=>!r.skip);return `<div class="summary"><span class="eyebrow">${t("DESTINATAIRES ÉLIGIBLES","ELIGIBLE RECIPIENTS")}</span><span class="large-number">${ready.length}</span><p>${t("Conversations individuelles. Aucune liste visible des autres membres.","Individual conversations. No visible list of other members.")}</p></div>${p.map(r=>`<div class="recipient"><strong>${esc(state.clients.find(c=>c.id===r.clientId).name)}</strong><span>${r.skip?t("Déjà reçu · exclu","Already received · excluded"):r.duplicates?t("Doublons retirés","Duplicates removed"):t("Prêt","Ready")}</span></div>`).join("")}${p.some(r=>r.duplicates)?`<p class="notice">${t("Les médias déjà reçus sont retirés. Un destinataire sans média nouveau est exclu de ce lot.","Previously received media is removed. Recipients with no new media are excluded from this batch.")}</p>`:""}<p class="small muted">${t("Les comptes suspendus sont exclus. Pour une actualité facultative, le choix de communication est aussi respecté.","Suspended accounts are excluded. Optional updates also respect communication preferences.")}</p>`;}
function broadcast(){return `<div class="broadcast"><section class="panel card-pad"><div class="field"><label for="bulk-group">${t("1. Choisir les destinataires","1. Choose recipients")}</label><select id="bulk-group">${["all",...new Set(state.clients.flatMap(c=>c.tags))].map(g=>`<option value="${esc(g)}" ${ui.group===g?"selected":""}>${g==="all"?t("Tous les actifs","All active clients"):esc(g)}</option>`).join("")}</select></div><div class="field"><label for="bulk-purpose">${t("Type de message","Message type")}</label><select id="bulk-purpose"><option value="service" ${ui.purpose==="service"?"selected":""}>${t("Contenu attendu","Requested content")}</option><option value="marketing" ${ui.purpose==="marketing"?"selected":""}>${t("Actualité facultative","Optional update")}</option></select></div><div class="field"><label>${t("2. Ajouter les médias","2. Add media")}</label><div class="chips">${state.media.map(m=>`<button class="chip ${ui.selected.includes(m.id)?"active":""}" data-select-media="${m.id}">${esc(m.title)}</button>`).join("")}</div></div><label class="check"><input type="checkbox" id="skip-duplicates" ${ui.skip?"checked":""}>${t("Éviter les médias déjà envoyés","Skip previously sent media")}</label><div class="field" style="margin-top:20px"><label for="bulk-text">${t("3. Écrire le message","3. Write your message")}</label><textarea id="bulk-text" maxlength="4000" placeholder="${t("Un mot pour accompagner ce partage…","A few words to go with this…")}">${esc(ui.bulkText)}</textarea></div><button class="btn primary" id="dispatch-demo" ${ui.bulkDone||!JessieDemo.plan(state,options()).some(r=>!r.skip)?"disabled":""}>${ui.bulkDone?t("✓ Simulation effectuée","✓ Simulation complete"):t("Simuler l’envoi individuel","Simulate individual delivery")}</button><p class="editor-status">${t("Aucun envoi réel. Vous retrouverez le résultat dans chaque conversation fictive.","No real delivery. Find the result in each fictional conversation.")}</p></section><aside class="panel card-pad"><h3>${t("Avant l’envoi","Before sending")}</h3><div id="delivery-summary">${summary()}</div><div id="bulk-result" aria-live="polite"></div></aside></div>`;}
function drawAdmin(){const name={messages:t("Vos conversations","Your conversations"),media:t("Votre médiathèque","Your media library"),broadcast:t("Partager, simplement","Share, simply")};return `<section class="workspace"><nav class="side-nav" aria-label="${t("Outils administrateur fictifs","Demo admin tools")}"><p class="eyebrow">${t("ESPACE JESSIE","JESSIE’S SPACE")}</p>${["messages","media","broadcast"].map((s,i)=>`<button data-section="${s}" class="${s===ui.section?"active":""}"><span aria-hidden="true">${["◯","▧","↗"][i]}</span>${[t("Messages","Messages"),t("Médiathèque","Media library"),t("Diffusion","Broadcast")][i]}</button>`).join("")}<p class="aside-note">${t("Les tags, les notes et les groupes appartiennent à votre espace de gestion. Ils ne sont pas montrés dans la vue client.","Tags, notes and groups belong to your management area. They are not shown in the client view.")}</p></nav><div class="workspace-content"><div class="workspace-title"><div><h2>${name[ui.section]}</h2><p>${t("Tout ce qu’il faut, rien de trop. Données de démonstration.","Everything you need, nothing extra. Demo data.")}</p></div><button class="btn small-btn" data-action="${ui.section==="media"?"prepare-bulk":"invite-info"}">${ui.section==="media"?t("Préparer un envoi","Prepare a send"):t("Invitation","Invitation")}</button></div>${ui.section==="messages"?`<div class="panel inbox ${ui.mobileChat?"mobile-chat":""}">${contacts()}${chat(false)}</div>`:ui.section==="media"?mediaView():broadcast()}</div></section>`;}
function render(){document.documentElement.lang=lang;$("#prototype-label").textContent=t("Prototype local, données fictives","Local prototype, fictional data");$("#header-note").textContent=t("Un espace à part. Une conversation avec Jessie.","A space apart. A conversation with Jessie.");$("#footer-note").textContent=t("Atelier d’interface · Aucun compte réel · Aucun envoi","Interface workshop · No real accounts · No delivery");$("#load-portrait").textContent=t("Photo","Photo");$("#switch-language").textContent=lang==="fr"?"EN":"FR";$("#brandmark").innerHTML=mark?`<img src="${esc(mark)}" alt="">`:"J";document.querySelectorAll("[data-view]").forEach((b,i)=>{b.classList.toggle("active",b.dataset.view===ui.view);b.setAttribute("aria-current",b.dataset.view===ui.view?"page":"false");b.textContent=[t("Accueil","Welcome"),t("Côté client","Client view"),t("Administration","Admin")][i];});document.querySelectorAll("[data-legal]").forEach((b,i)=>b.textContent=[t("Confidentialité","Privacy"),t("Conditions","Terms"),t("Mentions légales","Legal notice")][i]);$("#app").innerHTML=ui.view==="home"?drawHome():ui.view==="client"?`<section class="client-wrap"><div class="client-intro"><span class="eyebrow">${t("VOTRE ESPACE","YOUR SPACE")}</span><h2>${t("La conversation, au cœur.","The conversation comes first.")}</h2></div>${chat(true)}</section>`:drawAdmin();bindInputs();const box=$("#messages");if(box)box.scrollTop=box.scrollHeight;}
function draftKey(){return (ui.view==="client"?"client":"admin")+":"+ui.client;}
function bindInputs(){const input=$("#message-input");if(input){input.oninput=()=>ui.drafts[draftKey()]=input.value;input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();sendDemo();}};$("#message-form").onsubmit=e=>{e.preventDefault();sendDemo();};}if($("#age-declaration"))$("#age-declaration").onchange=e=>{state.ageDeclared=e.target.checked;$("#enter-demo").disabled=!state.ageDeclared;};if($("#search"))$("#search").oninput=e=>{ui.search=e.target.value;const pos=e.target.selectionStart;render();$("#search").focus();$("#search").setSelectionRange(pos,pos);};for(const [id,key] of [["bulk-group","group"],["bulk-purpose","purpose"],["skip-duplicates","skip"]]){const el=$("#"+id);if(el)el.onchange=()=>{ui[key]=el.type==="checkbox"?el.checked:el.value;ui.bulkDone=false;render();};}if($("#bulk-text"))$("#bulk-text").oninput=e=>{ui.bulkText=e.target.value;ui.bulkDone=false;$("#delivery-summary").innerHTML=summary();$("#dispatch-demo").disabled=!JessieDemo.plan(state,options()).some(r=>!r.skip);$("#dispatch-demo").textContent=t("Simuler l’envoi individuel","Simulate individual delivery");$("#bulk-result").textContent="";};}
function sendDemo(){const key=draftKey();const text=ui.drafts[key].trim();if(!text&&!ui.attachments[key].length)return;const c=state.clients.find(x=>x.id===ui.client);if(!c.active)return;const ids=[...ui.attachments[key]];state.messages[c.id].push({from:ui.view==="client"?"client":"jessie",text,media:ids,time:t("À l’instant · démo","Just now · demo")});if(ui.view==="admin")c.sent=[...new Set([...c.sent,...ids])];ui.drafts[key]="";ui.attachments[key]=[];render();$("#message-input").focus();}
function showProfile(){const c=state.clients.find(x=>x.id===ui.client);modal(c.name,`<p class="small muted">${t("Fiche fictive · visible ici uniquement dans l’espace administrateur","Fictional details · shown here only in the admin area")}</p><div class="tag-list">${c.tags.map(tag=>`<button data-remove-tag="${esc(tag)}" aria-label="${t("Retirer","Remove")} ${esc(tag)}">${esc(tag)} ×</button>`).join("")}</div><form id="tag-form" class="row"><input id="new-tag" maxlength="24" placeholder="${t("Ajouter un tag","Add a tag")}" aria-label="${t("Nouveau tag","New tag")}"><button class="btn small-btn">${t("Ajouter","Add")}</button></form><div class="field" style="margin-top:22px"><label for="private-note">${t("Note privée","Private note")}</label><textarea id="private-note" maxlength="1000" placeholder="${t("Une information utile, sans détail intime inutile.","Useful information, without unnecessary intimate details.")}">${esc(c.note)}</textarea></div><div class="field"><label for="reminder">${t("À recontacter le","Follow up on")}</label><input type="date" id="reminder" value="${esc(c.reminder)}"></div><button class="btn primary" id="save-profile">${t("Garder dans la démo","Keep in this demo")}</button><p class="editor-status">${c.sent.length} ${t("média(s) déjà envoyé(s) · réinitialisation à la fermeture","media already sent · resets when closed")}</p>`);$("#tag-form").onsubmit=e=>{e.preventDefault();const value=$("#new-tag").value.trim();if(value&&!c.tags.some(x=>x.toLowerCase()===value.toLowerCase()))c.tags.push(value);c.note=$("#private-note").value;c.reminder=$("#reminder").value;$("#modal").close();showProfile();};$("#save-profile").onclick=()=>{c.note=$("#private-note").value;c.reminder=$("#reminder").value;$("#modal").close();render();toast(t("Fiche mise à jour dans cet aperçu uniquement.","Details updated in this preview only."));};}
function showGallery(attach=false){const ids=new Set(state.messages[ui.client].flatMap(m=>m.media));const assets=attach?state.media:state.media.filter(m=>ids.has(m.id));modal(attach?t("Joindre un média fictif","Attach demo media"):t("Médias de cette conversation","Media in this conversation"),assets.length?`<div class="modal-gallery">${assets.map(m=>`<article>${art(m)}<p class="small">${esc(m.title)}</p>${attach?`<button class="btn small-btn" data-attach="${m.id}">${t("Joindre","Attach")}</button>`:""}</article>`).join("")}</div>`:`<p class="legal-note">${t("Aucun média dans cette conversation fictive pour le moment.","No media in this fictional conversation yet.")}</p>`);}
function showInfo(which){const bodies={privacy:t("Cet aperçu fonctionne uniquement dans ce navigateur. Il n’envoie aucune requête réseau et ne conserve pas vos saisies après rechargement. La photo choisie via le bouton Photo reste locale. La future politique décrira l’éditeur, l’hébergement, les sous-traitants, les finalités, les bases légales, les durées de conservation et vos droits. Ne saisissez pas de données réelles dans cet atelier.","This preview runs only in this browser. It makes no network requests and does not retain your inputs after reload. A photo selected with the Photo button stays local. The future policy will identify the operator, hosting, processors, purposes, legal bases, retention and your rights. Do not enter real personal data in this workshop."),terms:t("Brouillon de structure, pas des conditions contractuelles finales. L’application prévue est accessible sur invitation et réservée aux adultes. Aucune inscription, aucun paiement et aucun partage réel ne sont possibles dans cet aperçu. Les règles d’accès, de contenu, de suspension et de signalement seront précisées avant ouverture.","Draft structure, not final contractual terms. The planned application is invitation-only and for adults. No registration, payment or real sharing is possible in this preview. Access, content, suspension and reporting rules must be finalized before launch."),legal:t("L’identité juridique de l’éditeur, ses coordonnées et les informations exactes de l’hébergeur restent à compléter avec le propriétaire. Aucun nom de société, numéro d’immatriculation ou contact n’a été inventé. Ce document n’est pas prêt pour une publication de production.","The operator’s legal identity, contact details and exact hosting information must be supplied by the owner. No company name, registration number or contact has been invented. This document is not ready for production publication.")};modal(t("Document en préparation","Document in preparation"),`<p class="legal-note">${esc(bodies[which])}</p>`);}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.view){ui.view=b.dataset.view;ui.emoji=false;render();}else if(b.id==="enter-demo"&&state.ageDeclared){ui.view="client";ui.client="alex";render();}else if(b.dataset.section){ui.section=b.dataset.section;render();}else if(b.dataset.client){ui.client=b.dataset.client;ui.mobileChat=true;state.clients.find(c=>c.id===ui.client).unread=0;render();}else if(b.dataset.filter){ui.filter=b.dataset.filter;render();}else if(b.dataset.selectMedia){const id=b.dataset.selectMedia;ui.selected=ui.selected.includes(id)?ui.selected.filter(x=>x!==id):[...ui.selected,id];ui.bulkDone=false;render();}else if(b.dataset.emoji){const key=draftKey();ui.drafts[key]+=b.dataset.emoji;ui.emoji=false;render();$("#message-input").focus();}else if(b.dataset.attach){const key=draftKey();ui.attachments[key]=[...new Set([...ui.attachments[key],b.dataset.attach])];$("#modal").close();render();}else if(b.dataset.unattach){const key=draftKey();ui.attachments[key]=ui.attachments[key].filter(x=>x!==b.dataset.unattach);render();}else if(b.dataset.removeTag){const c=state.clients.find(x=>x.id===ui.client);c.note=$("#private-note").value;c.reminder=$("#reminder").value;c.tags=c.tags.filter(tag=>tag!==b.dataset.removeTag);$("#modal").close();showProfile();}else if(b.dataset.legal){showInfo(b.dataset.legal);}else if(b.id==="dispatch-demo"){const count=JessieDemo.dispatch(state,options(),`demo-${++ui.campaign}`);ui.bulkDone=true;render();$("#bulk-result").className="done";$("#bulk-result").textContent=count+" "+t("conversation(s) fictive(s) mise(s) à jour.","fictional conversation(s) updated.");}else if(b.dataset.action){switch(b.dataset.action){case"back":ui.mobileChat=false;render();break;case"emoji":ui.emoji=!ui.emoji;render();break;case"gallery":showGallery();break;case"attach":showGallery(true);break;case"profile":showProfile();break;case"prepare-bulk":ui.section="broadcast";render();break;case"invite-info":modal(t("Une invitation personnelle","A personal invitation"),`<p class="legal-note">${t("Parcours prévu : vous validez l’accès, créez une invitation limitée et révocable, puis le client ouvre sa conversation. Aucun lien d’accès réel n’est généré dans ce prototype. La déclaration 18+, l’éligibilité et la vérification de majorité restent des états distincts.","Planned flow: approve access, create a limited revocable invitation, then the client opens their conversation. This prototype generates no real access link. The 18+ declaration, eligibility and verified adulthood remain separate states.")}</p>`);break;case"preferences":modal(t("À votre rythme","At your own pace"),`<div class="stack"><p class="legal-note">${t("Les notifications seront facultatives, demandées après l’ouverture de la conversation. Texte prévu sur l’écran verrouillé : « Nouveau message ». Elles ne sont pas connectées dans cet aperçu.","Notifications will be optional and requested after opening the conversation. Planned lock-screen text: ‘New message’. They are not connected in this preview.")}</p><p class="legal-note">${t("Sur iPhone, les notifications Web Push demandent une application ajoutée à l’écran d’accueil et iOS 16.4 ou ultérieur. L’utilisation dans le navigateur restera possible sans notifications.","On iPhone, Web Push requires adding the app to the Home Screen and iOS 16.4 or later. Browser use will remain possible without notifications.")}</p><p class="notice">${t("Aucune promesse de chiffrement de bout en bout : cette fonction n’est pas implémentée.","No claim of end-to-end encryption: this feature is not implemented.")}</p></div>`);break;}}});
$("#switch-language").onclick=()=>{lang=lang==="fr"?"en":"fr";render();};
$("#load-portrait").onclick=()=>$("#portrait-file").click();
$("#portrait-file").onchange=async e=>{const f=e.target.files[0];if(!f)return;if(!["image/jpeg","image/png","image/webp"].includes(f.type)||f.size>8*1024*1024){toast(t("Choisir un JPG, PNG ou WebP de moins de 8 Mo.","Choose a JPG, PNG or WebP below 8 MB."));e.target.value="";return;}const reader=new FileReader();reader.onerror=()=>toast(t("Lecture de la photo impossible.","Could not read this photo."));reader.onload=()=>{portrait=String(reader.result);render();toast(t("Photo chargée localement. Rien n’a été publié.","Photo loaded locally. Nothing was published."));};reader.readAsDataURL(f);e.target.value="";};
render();
</script>
</body>
</html>
