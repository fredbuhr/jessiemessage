<!doctype html>
<html lang="fr" data-transition-legacy="__DEVICE_LEGACY_ORIGIN__" data-transition-primary="__DEVICE_PRIMARY_ORIGIN__">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#100d12" />
  <meta name="color-scheme" content="dark" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta name="referrer" content="no-referrer" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="stylesheet" href="/device-transition.css" />
  <link rel="stylesheet" href="/i18n.css" />
  <title>Jessie — Retrouver mon espace</title>
  <script src="/i18n.js" defer></script>
  <script src="/help-link.js" defer></script>
  <script src="/device-transition.js" defer></script>
</head>
<body>
  <main class="transition-card" aria-labelledby="transition-title">
    <header class="transition-header">
      <a class="brand" href="/app" aria-label="JessieMessage"><img src="/brand/icon-128.png" width="48" height="48" alt="" /><span>Jessie</span></a>
      <button id="transition-language" class="language" type="button" aria-label="Switch to English">EN</button>
    </header>
    <p class="eyebrow" id="transition-eyebrow">TOUJOURS À TES CÔTÉS</p>
    <h1 id="transition-title">Ton espace trouve sa nouvelle adresse.</h1>
    <p id="transition-copy">Retrouve tes messages sur jessiemessage.com, en gardant la connexion de cet appareil.</p>
    <p id="transition-status" role="status" aria-live="polite"></p>
    <div class="transition-actions">
      <a id="transition-login" class="button" href="/app" hidden>Me connecter</a>
      <button id="transition-start" class="button" type="button">Retrouver mon espace</button>
    </div>
    <a id="transition-back" class="back" href="/app">Revenir à mon espace</a>
    <p class="small" id="transition-notifications">Les notifications et l’icône de l’app se règlent ensuite sur la nouvelle adresse.</p>
    <a class="back" href="/help" target="_blank" rel="noopener noreferrer" data-help-link data-jm-i18n="Aide et confidentialité" aria-label="Aide et confidentialité (nouvel onglet)" data-jm-i18n-aria-label="Aide et confidentialité (nouvel onglet)">Aide et confidentialité</a>
    <noscript><p>Active JavaScript pour reprendre la connexion de cet appareil. Besoin d’aide ? <a href="mailto:contact@jessiemessage.com">contact@jessiemessage.com</a>.</p></noscript>
  </main>
</body>
</html>
